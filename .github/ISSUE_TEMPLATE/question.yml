name: Question
description: Ask how the model works, how to run something, or what a result means.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you have tried or read
      description: Commands, files, report sections or a policy desk link.
